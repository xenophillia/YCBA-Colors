<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Color palettes</title>
    <link rel="icon" type="image/png" href="favi_ycba.png">
    <link rel="stylesheet" href="styles.css?v=12">
  </head>
  <body>
    <header class="toolbar">
      <div class="controls">
        <label class="upload" for="painting-upload">Upload painting</label>
        <input id="painting-upload" type="file" accept="image/*">
        <select id="mode" aria-label="Color selection mode">
          <option value="prominent">Prominent</option>
          <option value="saturated">Saturated</option>
          <option value="complimentary">Complimentary</option>
        </select>
        <button id="restart" type="button" hidden>Restart</button>
      </div>
      <button id="gallery-toggle" type="button" aria-label="Toggle gallery view" aria-pressed="true">Gallery View</button>
    </header>
    <main class="gallery-view">
      <aside id="gallery" aria-label="Painting gallery"></aside>
      <section class="working" aria-label="Selected painting">
      <div class="preview-controls">
        <button id="gradient-toggle" type="button" aria-pressed="false" aria-controls="gradient-preview" disabled>Gradient</button>
        <button id="markers-toggle" type="button" aria-label="Show color source dots" title="Hide color source dots" aria-pressed="true" aria-controls="markers" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
            <path class="eye-slash" d="m3 3 18 18"/>
          </svg>
        </button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="empty-preview" aria-hidden="true"></div>
      <div class="workspace" hidden>
        <div class="painting">
          <img id="painting" alt="Uploaded painting" draggable="false">
          <div id="markers"></div>
          <div id="gradient-preview" role="img" aria-label="Palette gradient" hidden></div>
        </div>
        <div class="palette-panel">
          <div id="palette" aria-label="Painting colors"></div>
          <div class="palette-controls" aria-label="Number of colors">
            <button id="more-colors" type="button" aria-label="More colors">+</button>
            <button id="fewer-colors" type="button" aria-label="Fewer colors">−</button>
          </div>
          <div class="palette-save">
            <div class="export-panel" role="group" aria-labelledby="export-label">
              <span id="export-label">Export</span>
              <div class="export-buttons">
                <button id="save-gradient" class="export-button" type="button" title="Export gradient as PNG (S)" aria-keyshortcuts="S" disabled>PNG</button>
                <button id="export-svg" class="export-button" type="button" title="Export editable gradient as SVG" disabled>SVG</button>
                <button id="export-ase" class="export-button" type="button" title="Export stop colors as Adobe swatches" disabled>ASE</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      </section>
    </main>
    <script type="module" src="app.js?v=13"></script>
  </body>
</html>
